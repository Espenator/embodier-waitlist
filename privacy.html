  .doc p,.doc li{font-size:15px;line-height:1.7;color:#2b2b2b}
  .doc ul{padding-left:20px}
  .doc .updated{color:#6b7280;font-size:13px}
  .doc a{color:var(--gold)}
  /* contact + footer */
  .contact{background:var(--panel);border-top:1px solid var(--line);padding:34px 0;text-align:center}
  .contact .row{display:flex;flex-wrap:wrap;gap:10px 26px;justify-content:center;margin-top:12px}
  .contact a{color:#111;text-decoration:none;font-size:15px}
  .contact a:hover{color:var(--gold)}
  footer{padding:26px 0 40px;text-align:center;color:#6b7280;font-size:12px}
  footer .end{color:var(--gold);letter-spacing:2px;margin-top:8px;font-size:13px}

<h1>Privacy Policy</h1>
<p class="updated">Last updated: September 30, 2026.</p>
<p><strong>Mobile information will not be shared with third parties/affiliates for marketing/promotional purposes.</strong> Messaging consent is not shared with third parties or affiliates for marketing or promotional purposes.</p>
<h2>Who we are</h2>
<p>Embodier.ai is a registered assumed business name (DBA) of Espen P Schiefloe in Buncombe County, North Carolina — recorded July 2, 2025 (Book 6505, Page 1673). We operate the waitlist and application program for the Embodier token program. Contact: espen@embodier.ai.</p>
<h2>What we collect</h2>
<ul><li>Name</li><li>Email address</li><li>Phone number (if you provide one)</li><li>Tier of interest and referral code</li></ul>
<h2>How we use your data</h2>
<ul><li>To manage the waitlist and your application.</li><li>To send you updates by email, SMS, or WhatsApp about the waitlist, your application, and the launch.</li><li>To improve our program. We never sell your data.</li></ul>
<h2>Mobile data &amp; messaging</h2>
<p>If you give us your phone number, we may send you SMS, WhatsApp messages, or voice calls (including automated or AI-voiced calls) about the waitlist and the program. Mobile information will not be shared with third parties/affiliates for marketing/promotional purposes. You can opt out at any time by replying STOP. Reply HELP for help. Msg &amp; data rates may apply.</p>
<h2>Who we share data with</h2>
<p>Only with the providers needed to run the program: messaging (Twilio), payments (Stripe), and data storage (Google Workspace). We require each provider to protect your data. We never sell or rent your personal information.</p>
<h2>Your rights</h2>
<p>You may request access, correction, or deletion of your data at any time by writing to espen@embodier.ai. We will respond promptly.</p>
<h2>Contact</h2>
<p>For any privacy questions: espen@embodier.ai · SMS +1 828-731-2919 · WhatsApp +1 828-731-2919.</p>
